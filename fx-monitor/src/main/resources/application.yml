# This file holds no secrets and works as-is after a clone. Put personal overrides in
# application-local.yml next to it (gitignored) or pass them as environment variables.
spring:
  application:
    name: currency-exchange-platform

  config:
    import: "optional:classpath:application-local.yml"

  datasource:
    url: jdbc:h2:file:${user.home}/.fx-monitor/data/fxmonitor;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true

  cache:
    type: simple

  security:
    jwt:
      # Leave JWT_SECRET unset for local use: a random 512-bit secret is generated on first
      # run and kept in secret-file. Set JWT_SECRET (>= 64 characters) to supply your own.
      secret: ${JWT_SECRET:}
      secret-file: ${user.home}/.fx-monitor/jwt-secret
      expiration: 900000 # 15-minute Access Token
      refresh-expiration: 604800000 # 7-day Refresh Token

server:
  port: 8080
  # Only this machine can reach the REST API (the desktop UI and scripts/export-fx-report.ps1
  # both call localhost). Use 0.0.0.0 to expose it on the network.
  address: 127.0.0.1

# Forex API Configuration (the v4 endpoint is free and needs no API key)
forex:
  api:
    url: https://api.exchangerate-api.com/v4/latest
    update-interval: 3600 # 1 hour
    timeout: 5000
  # Historical rate storage: which pairs to snapshot and how often (seconds).
  snapshot:
    base: EUR
    currencies: USD,GBP,JPY,CNY,CHF,CAD,AUD
    interval: 3600 # 1 hour
  alert:
    # How often active rate alerts are re-evaluated against live quotes (seconds).
    interval: 900 # 15 minutes

# Platform Fee Configuration
platform:
  fees:
    exchange-percentage: 0.5
    transfer-percentage: 0.1
    withdrawal-percentage: 0.2
    min-exchange-amount: 1.00
    max-daily-exchange: 10000.00

logging:
  level:
    com.currencyexchange: DEBUG
    org.springframework.security: DEBUG
    org.springframework.web: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
